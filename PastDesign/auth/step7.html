<!DOCTYPE html>
<html data-bs-theme="light" lang="fa" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>مهندس من / پیدا کردن مهندس، پیمانکار و متخصص ساختمان در کشور</title>
    <meta name="robots" content="index, follow">
    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/IRANSansWeb.css">
    <link rel="stylesheet" href="../assets/css/bss-overrides.css">
    <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body class="text-center"><div class="container step-7 my-5">
    <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-5">

            <h4 class="fw-bold mb-4 font-18">عضویت در نظام مهندسی</h4>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <div class="hyrcan_select_card" onclick="hyrcan_selectNezam('no', this)">
                        خیر
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="hyrcan_select_card" onclick="hyrcan_selectNezam('yes', this)">
                        بله
                    </div>
                </div>
            </div>

            <div id="hyrcan_nezamSection" class="d-none">
                <div class="mb-3">
                    <label class="form-label">شماره عضویت</label>
                    <input id="hyrcan_membershipNumber" class="form-control" type="text" />
                </div>

                <div class="mb-3">
                    <label class="form-label">دارای پروانه اشتغال هستید؟</label>
                    <select id="hyrcan_hasParvaneh" class="form-select" onchange="hyrcan_handleParvaneh(this.value)">
                        <option value="" selected disabled>انتخاب کنید</option>
                        <option value="no">خیر</option>
                        <option value="yes">بله</option>
                    </select>
                </div>

                <div id="hyrcan_parvanehSection" class="d-none">
                    <div class="mb-3">
                        <label class="form-label">شماره پروانه</label>
                        <input id="hyrcan_parvanehNumber" class="form-control" type="text" />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">آپلود مدرک پروانه</label>
                        <input id="hyrcan_parvanehFile" class="form-control" type="file" />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">رشته دارای صلاحیت</label>
                        <select id="hyrcan_reshtehSelect" class="form-select" onchange="hyrcan_handleReshteh(this.value)">
                            <option value="" selected disabled>انتخاب رشته</option>
                            <option value="omran">عمران</option>
                            <option value="memari">معماری</option>
                            <option value="bargh">برق</option>
                            <option value="mechanic">مکانیک</option>
                            <option value="naghshe">نقشه‌برداری</option>
                            <option value="traffic">ترافیک</option>
                            <option value="shahrsazi">شهرسازی</option>
                        </select>
                    </div>

                    <div id="hyrcan_salahiyatSection" class="d-none">
                        <label class="form-label fw-semibold">صلاحیت‌ها</label>
                        <div id="hyrcan_salahiyatCards" class="row g-3"></div>
                        <div id="hyrcan_salahiyatError" class="hyrcan_error_text mt-2 d-none">
                            حداقل یک صلاحیت انتخاب کنید
                        </div>
                    </div>
                </div>
            </div>

            <div id="hyrcan_nezamError" class="hyrcan_error_text d-none">
                لطفاً اطلاعات را کامل کنید
            </div>

            <button class="btn btn-primary w-100 mt-3" type="button" onclick="hyrcan_validateNezam()">
                تایید و گام بعدی
            </button>

        </div>
    </div>
</div>

    <script src="../assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/main.js"></script>
</body>

</html>
