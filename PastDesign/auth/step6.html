<!DOCTYPE html>
<html data-bs-theme="light" lang="fa" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>مهندس من / پیدا کردن مهندس، پیمانکار و متخصص ساختمان در کشور</title>
    <meta name="robots" content="index, follow">
    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/IRANSansWeb.css">
    <link rel="stylesheet" href="../assets/css/bss-overrides.css">
    <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body class="text-center"><div class="container step-6 my-5">
    <div class="card border-0 shadow-lg rounded-4">
        <div class="card-body p-5">

            <!-- Step Indicator -->
            <div class="d-flex justify-content-between align-items-center mb-5">
                <div class="step-circle active" id="circle1">1</div>
                <div class="step-line"></div>
                <div class="step-circle" id="circle2">2</div>
                <div class="step-line"></div>
                <div class="step-circle" id="circle3">3</div>
            </div>

            <!-- STEP 1 -->
            <div class="form-step active-step" id="step1">
                <h1 class="text-center fw-bold mb-4">سطح تحصیلات شما</h1>
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="select-card" onclick="selectLevel('diplomaOrLower')">
                            دیپلم و پایین تر
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="select-card" onclick="selectLevel('aboveDiploma')">
                            دیپلم و بالاتر
                        </div>
                    </div>
                </div>
            </div>

            <!-- STEP 2 -->
            <div class="form-step" id="step2">
                <h4 class="fw-bold mb-4">مقاطع تحصیلی خود را انتخاب کنید</h4>
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="select-card degree-card" data-degree="کاردانی">کاردانی</div>
                    </div>
                    <div class="col-md-6">
                        <div class="select-card degree-card" data-degree="کارشناسی">کارشناسی</div>
                    </div>
                    <div class="col-md-6">
                        <div class="select-card degree-card" data-degree="کارشناسی ارشد">کارشناسی ارشد</div>
                    </div>
                    <div class="col-md-6">
                        <div class="select-card degree-card" data-degree="دکتری">دکتری</div>
                    </div>
                </div>
                <button type="button" class="btn btn-primary mt-4 w-50 rounded-3" onclick="goToStep(3)">
                    ادامه
                </button>
            </div>

            <!-- STEP 3 -->
            <div class="form-step" id="step3">
                <h4 class="fw-bold mb-4">بارگذاری مدارک</h4>
                <div id="uploadContainer"></div>
                
                <button type="button" class="btn btn-primary mt-4 w-50 rounded-3">
                    تایید و گام بعدی
                </button>
            </div>

        </div>
    </div>
</div>

    <script src="../assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/main.js"></script>
</body>

</html>
