<!DOCTYPE html>
<html data-bs-theme="light" lang="fa" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>مهندس من / پیدا کردن مهندس، پیمانکار و متخصص ساختمان در کشور</title>
    <meta name="robots" content="index, follow">
    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/IRANSansWeb.css">
    <link rel="stylesheet" href="../assets/css/bss-overrides.css">
    <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body class="text-center"><div class="container step-5 my-5 px-3">
    <section class="expertise-section text-center mb-4">
        <h2 class="section-title">تخصص‌های انتخابی شما</h2>
        <p id="expertiseCount" class="expertise-count">0 تخصص انتخاب شده</p>

        <div class="expertise-box">
            <ul id="expertiseList" class="expertise-list">
                <li class="expertise-item">
                    <span class="expertise-text">نقشه - سیماک - شمیم</span>
                    <button class="remove-btn" type="button" aria-label="حذف تخصص">
                        <svg viewBox="0 0 20 20">
                            <path d="M6 6L14 14M14 6L6 14"></path>
                        </svg>
                    </button>
                </li>

                <li class="expertise-item">
                    <span class="expertise-text">سیماک - شمیم</span>
                    <button class="remove-btn" type="button" aria-label="حذف تخصص">
                        <svg viewBox="0 0 20 20">
                            <path d="M6 6L14 14M14 6L6 14"></path>
                        </svg>
                    </button>
                </li>

                <li class="expertise-item">
                    <span class="expertise-text">نقشه برداری UTM - سیماک - شمیم</span>
                    <button class="remove-btn" type="button" aria-label="حذف تخصص">
                        <svg viewBox="0 0 20 20">
                            <path d="M6 6L14 14M14 6L6 14"></path>
                        </svg>
                    </button>
                </li>

                <li class="expertise-item">
                    <span class="expertise-text">نقشه برداری با پهپاد</span>
                    <button class="remove-btn" type="button" aria-label="حذف تخصص">
                        <svg viewBox="0 0 20 20">
                            <path d="M6 6L14 14M14 6L6 14"></path>
                        </svg>
                    </button>
                </li>

                <li class="expertise-item">
                    <span class="expertise-text">ترسیم نقشه معماری</span>
                    <button class="remove-btn" type="button" aria-label="حذف تخصص">
                        <svg viewBox="0 0 20 20">
                            <path d="M6 6L14 14M14 6L6 14"></path>
                        </svg>
                    </button>
                </li>
            </ul>

            <div class="expertise-actions">
                <button id="toggleExpertiseBtn" class="toggle-expertise-link d-none" type="button">
                    نمایش بیشتر
                </button>

                <button id="goToPreviousStepBtn" class="btn btn-primary" type="button">
                    افزودن تخصص جدید
                </button>
            </div>
        </div>
    </section>

    <div >
        <section class="personal-info-section">
            <h2 class="mb-4">تکمیل اطلاعات شخصی</h2>

            <form class="w-100" method="POST" action="" enctype="multipart/form-data">
                <!-- @csrf -->

                <div class="text-end mb-3">
                    <label class="form-label" for="firstName">نام *</label>
                    <input
                        id="firstName"
                        class="form-control"
                        type="text"
                        placeholder="نام خود را وارد کنید"
                        name="first_name"
                        value=""
                        required
                    />
                </div>

                <div class="text-end mb-3">
                    <label class="form-label" for="lastName">نام خانوادگی *</label>
                    <input
                        id="lastName"
                        class="form-control"
                        type="text"
                        placeholder="نام خانوادگی خود را وارد کنید"
                        name="last_name"
                        value=""
                        required
                    />
                </div>

                <div class="text-end mb-3">
                    <label class="form-label">شماره ملی وارد شده *</label>
                    <div class="form-control text-secondary">265646476</div>
                    <input type="hidden" name="national_id" value="265646476" />
                </div>

                <div class="text-end mb-3">
                    <label class="form-label" for="birthProvince">استان محل فعالیت</label>
                    <select id="birthProvince" class="form-select" name="province_id" required>
                        <option value="" selected disabled>انتخاب کنید</option>
                        <option value="1">آذربایجان شرقی</option>
                        <option value="2">آذربایجان غربی</option>
                    </select>
                </div>

                <div class="text-end mb-3">
                    <label class="form-label" for="birthCity">شهر محل فعالیت</label>
                    <select id="birthCity" class="form-select" name="city_id" required>
                        <option value="" selected disabled>انتخاب کنید</option>
                        <option value="101">نقده</option>
                        <option value="202">تبریز</option>
                    </select>
                </div>

                <div class="profile-box mb-3">
                    <label class="form-label d-block">تصویر پروفایل</label>
                    <img
                        id="preview"
                        class="mb-2"
                        src="https://via.placeholder.com/100"
                        alt="profile"
                        width="100"
                        height="100"
                    />
                    <input
                        id="fileInput"
                        class="form-control form-control-sm"
                        type="file"
                        name="avatar"
                        accept="image/*"
                    />
                </div>

                <button id="submitBtn" class="btn btn-primary w-100 btn-action" type="submit">
                    تایید و گام بعدی
                </button>
            </form>
        </section>
    </div>
</div>
    <script src="../assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/main.js"></script>
</body>

</html>
