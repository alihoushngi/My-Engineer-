<!DOCTYPE html>
<html data-bs-theme="light" lang="fa" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>مهندس من / پیدا کردن مهندس، پیمانکار و متخصص ساختمان در کشور</title>
    <meta name="robots" content="index, follow">
    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/IRANSansWeb.css">
    <link rel="stylesheet" href="../assets/css/bss-overrides.css">
    <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body class="text-center"><div class="container step-2">
    <h1>اعتبار سنجی</h1>
    <p>
        کد 5 رقمی پیامک شده به شماره
        <span id="phoneNumber">0911213232</span>
        را وارد کنید
    </p>

    <form id="otpForm" method="POST" action="">
        <!-- @csrf -->

        <div class="form-box">
            <input class="form-control otp-input" type="text" maxlength="1" inputmode="numeric" name="otp[]" pattern="[0-9]" />
            <input class="form-control otp-input" type="text" maxlength="1" inputmode="numeric" name="otp[]" pattern="[0-9]" />
            <input class="form-control otp-input" type="text" maxlength="1" inputmode="numeric" name="otp[]" pattern="[0-9]" />
            <input class="form-control otp-input" type="text" maxlength="1" inputmode="numeric" name="otp[]" pattern="[0-9]" />
            <input class="form-control otp-input" type="text" maxlength="1" inputmode="numeric" name="otp[]" pattern="[0-9]" />
        </div>

        <button id="otpSubmitBtn" class="btn btn-primary mt-4" type="submit">
            تایید کد
        </button>

        <div id="errorMsg" class="text-center text-danger mt-2"></div>
    </form>

    <a id="resendLink" class="resend-code" href="step3.html">
        ارسال مجدد کد تایید (120 ثانیه)
    </a>

    <a class="link-secondary d-flex justify-content-center my-5" href="#">
        ویرایش شماره تماس
    </a>
</div>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("otpForm");
    const inputs = Array.from(document.querySelectorAll(".otp-input"));
    const errorMsg = document.getElementById("errorMsg");
    const resendLink = document.getElementById("resendLink");

    const OTP_LENGTH = 5;
    const RESEND_SECONDS = 120;

    if (!inputs.length) return;

    /* =========================
       Helpers
    ========================= */
    function onlyDigit(value) {
        return value.replace(/\D/g, "");
    }

    function showError(message) {
        if (errorMsg) errorMsg.textContent = message;
    }

    function clearError() {
        if (errorMsg) errorMsg.textContent = "";
    }

    function getOtpValue() {
        return inputs.map(input => input.value).join("");
    }

    function isOtpComplete() {
        return getOtpValue().length === OTP_LENGTH && inputs.every(input => /^\d$/.test(input.value));
    }

    function focusInput(index) {
        if (inputs[index]) {
            inputs[index].focus();
            inputs[index].select();
        }
    }

    /* =========================
       Input Behavior
    ========================= */
    inputs.forEach((input, index) => {
        input.addEventListener("input", (e) => {
            let value = onlyDigit(e.target.value);

            if (!value) {
                e.target.value = "";
                return;
            }

            // اگر بیشتر از یک کاراکتر وارد شد، فقط مدیریت هوشمند
            const chars = value.split("");

            for (let i = 0; i < chars.length; i++) {
                const targetIndex = index + i;
                if (inputs[targetIndex]) {
                    inputs[targetIndex].value = chars[i];
                }
            }

            const nextIndex = Math.min(index + chars.length, inputs.length - 1);

            if (index + chars.length < inputs.length) {
                focusInput(index + chars.length);
            } else {
                focusInput(nextIndex);
            }

            clearError();
        });

        input.addEventListener("keydown", (e) => {
            const key = e.key;

            // اجازه به کلیدهای کنترلی
            const allowedKeys = [
                "Backspace", "Delete", "Tab",
                "ArrowLeft", "ArrowRight", "Home", "End"
            ];

            if (allowedKeys.includes(key)) {
                if (key === "Backspace") {
                    if (input.value === "" && index > 0) {
                        e.preventDefault();
                        inputs[index - 1].value = "";
                        focusInput(index - 1);
                    }
                }
                return;
            }

            // فقط عدد
            if (!/^\d$/.test(key)) {
                e.preventDefault();
            }
        });

        input.addEventListener("focus", () => {
            input.select();
        });

        input.addEventListener("paste", (e) => {
            e.preventDefault();

            const pastedData = onlyDigit((e.clipboardData || window.clipboardData).getData("text"));
            if (!pastedData) return;

            const chars = pastedData.slice(0, OTP_LENGTH).split("");

            inputs.forEach(inp => inp.value = "");

            chars.forEach((char, i) => {
                if (inputs[i]) inputs[i].value = char;
            });

            if (chars.length < OTP_LENGTH) {
                focusInput(chars.length);
            } else {
                focusInput(OTP_LENGTH - 1);
            }

            clearError();
        });
    });

    /* =========================
       Form Submit Validation
    ========================= */
    form?.addEventListener("submit", (e) => {
        clearError();

        const otp = getOtpValue();

        if (otp.length !== OTP_LENGTH) {
            e.preventDefault();
            showError("لطفاً کد ۵ رقمی را کامل وارد کنید");
            return;
        }

        if (!/^\d{5}$/.test(otp)) {
            e.preventDefault();
            showError("کد تایید باید فقط شامل عدد باشد");
            return;
        }

        // اگر خواستی قبل از ارسال، یک input مخفی هم مقداردهی شود:
        // document.getElementById("otpCode").value = otp;
    });

    /* =========================
       Resend Timer
    ========================= */
    if (resendLink) {
        let timeLeft = RESEND_SECONDS;
        const originalHref = resendLink.getAttribute("href");

        resendLink.removeAttribute("href");
        resendLink.style.pointerEvents = "none";
        resendLink.style.opacity = "0.6";

        const timer = setInterval(() => {
            if (timeLeft > 0) {
                resendLink.textContent = `ارسال مجدد کد تایید (${timeLeft} ثانیه)`;
                timeLeft--;
            } else {
                clearInterval(timer);
                resendLink.textContent = "ارسال مجدد کد تایید";
                resendLink.setAttribute("href", originalHref || "#");
                resendLink.style.pointerEvents = "auto";
                resendLink.style.opacity = "1";
            }
        }, 1000);
    }

    /* =========================
       Initial Focus
    ========================= */
    focusInput(0);
});
</script>

    <script src="../assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/main.js"></script>
</body>

</html>
