<!DOCTYPE html>
<html data-bs-theme="light" lang="fa" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>مهندس من / پیدا کردن مهندس، پیمانکار و متخصص ساختمان در کشور</title>
    <meta name="robots" content="index, follow">
    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/IRANSansWeb.css">
    <link rel="stylesheet" href="../assets/css/bss-overrides.css">
    <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body class="text-center"><section class="container step-9 mt-5">
    <form action="{{ route('resume.final.store') }}" method="POST" enctype="multipart/form-data">


        <!-- مرحله دوم رزومه -->
        <div id="resumeStepTwo">
            <h4 class="mt-4">تکمیل رزومه کاری</h4>

            <label for="resumeImageInput" class="resume-upload-box">
                عکس های رزومه کاری خود را اینجا بارگذاری کنید
                <input id="resumeImageInput"
                       name="resume_images[]"
                       type="file"
                       multiple
                       accept="image/*"
                       hidden />
            </label>

            <div id="resumePreviewContainer" class="resume-preview-wrapper"></div>

            <button class="resume-cert-btn" type="button" data-bs-toggle="modal" data-bs-target="#resumeCertModal">
                افزودن گواهینامه شغلی
            </button>

            <!-- لیست گواهینامه‌های اضافه شده -->
            <div id="certPreviewContainer" class="mt-3"></div>

            <div class="resume-check-wrapper">
                <input id="resumeRulesCheck1" name="accept_rules" value="1" type="checkbox" required />
                <label for="resumeRulesCheck1">
                    با انتخاب این گزینه موافقت خود را با مجموعه <span class="text-danger">قوانین و مقررات</span> سایت اعلام میدارم
                </label>
            </div>

            

            <button class="btn btn-success w-100 mt-3" type="submit">
                ثبت نهایی
            </button>
        </div>

        <!-- مودال گواهینامه‌ها -->
        <div id="resumeCertModal" class="modal fade" tabindex="-1" aria-labelledby="resumeCertModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 id="resumeCertModalLabel" class="modal-title">گواهینامه‌های شغلی</h5>
                        <button class="btn-close" data-bs-dismiss="modal" aria-label="بستن"></button>
                    </div>

                    <div class="modal-body">
                        <div id="certRowsWrapper">
                            <div class="cert-row d-flex gap-2 align-items-center mb-2">
                                <input class="form-control cert-title"
                                       name="certificates[0][title]"
                                       type="text"
                                       placeholder="عنوان گواهینامه" />

                                <input class="form-control cert-file"
                                       name="certificates[0][file]"
                                       type="file"
                                       accept=".pdf,.jpg,.png,.jpeg" />
                            </div>
                        </div>

                        <button class="btn btn-outline-primary w-100 mt-2" type="button" onclick="addCertRow()">
                            افزودن ردیف
                        </button>
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-success w-100" type="button" onclick="confirmCertificates()">
                            تأیید گواهینامه‌ها
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </form>
</section>

    <script src="../assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/main.js"></script>
</body>

</html>
