<!DOCTYPE html>
<html data-bs-theme="light" lang="fa" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>مهندس من / پیدا کردن مهندس، پیمانکار و متخصص ساختمان در کشور</title>
    <meta name="robots" content="index, follow">
    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/IRANSansWeb.css">
    <link rel="stylesheet" href="../assets/css/bss-overrides.css">
    <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body class="text-center">
    <div class="container step-8 mt-5">
        <div class="resume-step-wrapper">
            <!-- فرم اصلی برای ارسال داده‌ها -->
            <form id="resumeForm" action="/submit-resume" method="POST">
               
                
                <div id="resumeStepOne">
                    <h1 class="mb-4">اطلاعات رزومه</h1>

                    <!-- فیلد سال تجربه با محدودیت عددی -->
                    <input 
                        id="resumeYearsInput" 
                        class="form-control mb-3" 
                        name="experience_years" 
                        type="text" 
                        inputmode="numeric" 
                        pattern="[0-9]*" 
                        oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                        placeholder="تعداد سال‌های تجربه" 
                    />

                    <!-- فیلد متن رزومه -->
                    <div class="resume-textarea mb-3">
                        <textarea 
                            id="resumeTextInput" 
                            name="resume_text" 
                            class="form-control" 
                            rows="5"
                            placeholder="رزومه خود را بنویسید (حداقل ۱۰ کاراکتر)..." 
                            minlength="10"
                        ></textarea>
                    </div>

                    <!-- دکمه ارسال -->
                    <button class="btn btn-primary w-100" type="submit">
                        مرحله بعد
                    </button>
                </div>
            </form>
        </div>
    </div>


    <script src="../assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/main.js"></script>
</body>

</html>
